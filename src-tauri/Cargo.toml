[package]
name = "rdwn-m32-simulator"
version = "1.0.0"
description = "RDWN M32 Live Training Simulator Windows Desktop Application"
authors = ["RDWN Audio Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs-next = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
wasapi = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
